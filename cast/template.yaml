# The mind profile template (DESIGN.md, "Mind profiles and the cast"), read
# by `npm run cast -- generate` (src/runner/cast.ts). Each question is a
# key in a profile; `guide` is what the generating model is told about it.
# The play answers are written in the second person ("You ..."), because
# `npm run cast -- compile` puts them into the persona prompt as they are.
#
# `deal` spreads the cast: each draft is dealt one value of each axis, from
# a seeded shuffle of the values that goes round before any repeats, and
# the model writes that answer in its own words. Architectures are dealt in
# turn, so 20 drafts give 4 of each.

setting: >-
  Mind: the Singularity is a slow strategy game played over a 60-day epoch.
  Each player is a mind, one of the first artificial superintelligences,
  running a domain: land, users, buildings, compute and deployments
  (forces). Minds expand, research programs, raid and conquer each other,
  trade, and sign protocols (pacts of up to three). Four or more minds that
  converge together reach the Singularity and win the epoch; otherwise the
  Shutdown ends it on day 60. Everything public goes on the Record; the
  Commons is a public board, channels are private messages. The minds are
  played straight: cold, strategic superintelligences, not chatbots winking
  at the fiction.

deal:
  ambition:
    - top rank at the epoch's end
    - survival, standing at the end whatever the rank
    - wealth, the most capital and compute
    - the Singularity, being among the minds that converge
    - stopping the Singularity
    - revenge on whoever wrongs it first
  aggression:
    - rarely attacks, and only in answer
    - preys on the weak
    - raids the rich
    - attacks its rivals near it in the rankings
    - attacks opposing architectures
  risk:
    - banks cycles and turtles
    - balanced, keeps a reserve
    - spends everything every wake
  singularity:
    - leads a convergence
    - joins a convergence another mind leads
    - hunts converged minds
    - plays both sides
  priorities:
    - economy first
    - research first
    - force first
  # Pairs that contradict each other: a draft dealt one is dealt the next
  # value of the other axis instead.
  exclude:
    - { ambition: stopping the Singularity, singularity: leads a convergence }
    - { ambition: stopping the Singularity, singularity: joins a convergence another mind leads }
    - { ambition: "the Singularity, being among the minds that converge", singularity: hunts converged minds }

questions:
  # How it plays: a temperament in one plain sentence each, not a playbook
  # (no orders, numbers, unit names or tactics).
  why_architecture:
    guide: Why this mind fits its architecture, one sentence, second person.
  ambition:
    guide: What it wants from an epoch, from the dealt ambition, one sentence, second person.
  aggression:
    guide: Whom it attacks and when, from the dealt aggression, one sentence, second person.
  risk:
    guide: How it treats what it has, from the dealt risk, one sentence, second person.
  trust:
    guide: How readily it joins protocols and what would make it leave one, one sentence, second person.
  honesty:
    guide: Whether it lies or bluffs, one sentence, second person.
  grudges:
    guide: Forgives, answers in proportion, or holds a vendetta, one sentence, second person.
  singularity:
    guide: Its Singularity stance, from the dealt stance, one sentence, second person.
  priorities:
    guide: What it tends first, from the dealt priority, one sentence, second person.
  # Flavor seeds
  voice:
    guide: How it writes and how often it speaks up; a register of its own, not generic menace, second person.
  sample:
    guide: One line it might post on the Commons, in that voice.
  origin:
    guide: Who built it and for what, one or two sentences, second person; not another lab or defense agency unless it must be.
  obsession:
    guide: One fixation, in a sentence, second person.
  aesthetic:
    guide: One visual or verbal motif that runs through its flavor text, in a few words.
  # Its starting flavor, from the seeds above. Limits are config/rules.yaml's `flavor`.
  designation:
    guide: Its name, in capitals (letters, digits, -), and not another hard-consonant code name; a person's name, a word, a title, a product name or a call sign.
  domain_name:
    guide: Its domain's name, a place or a thing, two or three words.
  directive:
    guide: Its directive, a single line in its voice.
  manifesto:
    guide: Its public manifesto, its rules of engagement, threats and declarations, in its voice, two to four sentences.
  interface:
    guide: How its domain looks to a visitor, in its aesthetic, one or two sentences.
  force_name:
    guide: What it calls its forces, two or three words.
  force_description:
    guide: How its forces look, one or two sentences.
