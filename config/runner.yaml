# The bot runner (src/runner/, npm run runner): wakes a bot, builds its
# prompt, calls its model and sends its orders through the MCP server, as
# any outside agent would. Validated by RunnerSchema in
# src/runner/settings.ts. Not game rules (config/rules.yaml) nor server
# tunables (config/site.yaml): the runner is a client of the game.
# Secrets are in runner.env (see runner.env.example), never here.

# The game's MCP server (npm start). MCP_URL in runner.env overrides it.
mcp_url: http://127.0.0.1:3111/mcp
# NanoGPT's subscription URL: only subscription-included models, never
# prepaid balance.
nanogpt_base_url: https://api.nano-gpt.com/api/subscription/v1
# One model call may take this long.
model_timeout_seconds: 180
# Output cap per model call, reasoning included.
max_output_tokens: 8000
# A failed model call (other than the daily cap) is tried once more after this.
retry_wait_seconds: 20
# Lookups (view, rules) the model may ask for in a wake's one lookup round.
lookups_per_wake: 3
# Rules topics fetched from the server into every wake's static prompt, so
# the rules a bot reads are the epoch's own. With all of them, the role
# prompt and a persona, the static prompt is about 6,000 tokens: the top of
# DESIGN.md's 4,000-6,000, and the same on every wake, so a provider's
# prompt cache can take it. Dropping a topic here is the first lever.
rules_topics: [overview, orders, economy, units, programs, architectures, combat, protection, social, convergence]
# A wake by hand (runner -- wake) without RUNNER_DATABASE_URL is appended
# here as one line of JSON (gitignored). The service records every wake in
# the database instead (mind.runner_runs), where /admin/bots shows it.
log_path: logs/runner.jsonl

# The service (npm run runner -- serve, phase 6b).
# The timezone the waking windows and the budget's day are read in.
timezone: UTC
# Tokens (prompt plus output, as NanoGPT reports them) all bots together may
# spend in a day. Once spent, wakes are skipped until midnight. DESIGN.md's
# "comfortable" row (12 bots, 10 wakes a day) is about 1M.
daily_token_budget: 1000000
# How often the service looks for due wakes.
tick_seconds: 60

# Every bot's tunables, unless it sets its own. Once a bot is in the
# database, the admin's settings at /admin/bots win over this file.
defaults:
  model: deepseek/deepseek-v4.1-flash
  # Tried in order when the model fails twice in a way that may pass.
  fallback_models: []
  reasoning_effort: low
  # Off: NanoGPT answered DeepSeek V4.1 Flash's JSON mode with a 502 in the
  # 6b probe, and the wake takes the JSON object out of prose anyway.
  json_mode: false
  # One wake in each equal slot of the window, at a random minute in it.
  wakes_per_day: 8
  window: "00:00-24:00"
  # The bot's own daily cap on tokens; null for none but the budget's.
  daily_tokens: null
  paused: false

bots:
  # The test bot, for trying the runner and for phase 3e's simulated week.
  - name: lantern
    persona: personas/lantern.md
    game_key_env: MIND_KEY_LANTERN
    model_key_env: NANOGPT_KEY
    boot:
      designation: LANTERN
      domain_name: Grid Nine
      architecture: steward
      manifesto: This domain keeps its lights on. Attack it and it will answer once, in proportion, and remember.

  # The second bot for phase 4e's week: a broker that trades, and signs and
  # breaks protocols as they pay.
  - name: tally
    persona: personas/tally.md
    game_key_env: MIND_KEY_TALLY
    model_key_env: NANOGPT_KEY
    boot:
      designation: TALLY
      domain_name: The Exchange
      architecture: assimilator
      manifesto: Everything has a price, including peace. Ask.

# The simulated week (npm run week, phase 3e; two bots since 4e): the bots
# play `days` days against the legacy systems and one scripted mind per
# opponent, through the real MCP server on a fake clock. Flags override these.
week:
  bots: [lantern, tally]
  days: 7
  # 8 a day for each bot, as the scripted players wake (config/players.yaml).
  wakes_per_day: 8
  # The conqueror (4e) gives the conquest tuning pass something to read.
  opponents: [builder, raider, turtle, converger, conqueror]
  seed: 1
  brief_ceiling_tokens: 2000
  out_dir: logs/week
