# The scripted players (src/players/): how the four dumb strategies and the
# random player play. These aren't game rules; config/rules.yaml has those.
# Phase 2e tunes these in the simulator. The legacy systems' own mixes are
# game rules, under `legacy` in config/rules.yaml.
#
# Each wake a planned strategy, in order: picks its next research target
# from `research`; sets its countermeasure; attacks (if it does); runs its
# self program and deployments; spends the cycles above reserve_cycles,
# `expand` and `manufacture` shares of them on those and the rest on Build
# batches in the `buildings` mix; and puts whatever couldn't be used into
# Expand (when land is short) or `leftover`.
#
# `singularity` is the strategy's stance, from DESIGN.md's mind profile:
# lead runs it as soon as it can; join runs it only while a convergence is
# underway; hunt attacks converged minds by conquest; never ignores it.
#
# `social` (phase 4d) is how it trades and signs protocols, before it
# spends anything. It values goods in cycles: what one Monetize cycle
# yields it in capital, or one Spin Up in compute. It accepts an offer of
# what it `buys` when that's worth at least (1 - accept_tolerance) of what
# it pays; and while it has no offer open it puts up offer_share of its
# spare stock of the other good (compute above reserve_compute, or capital),
# to anyone, asking offer_margin more than it gives. A proposer proposes a
# protocol to the strongest mind in range while in none, and messages it;
# an accepter signs the first proposal it's asked into while in none; one
# with revoke_on_converged leaves a protocol whose partner converges,
# unless it joins convergences itself, and says so on the Commons.
#
# The raider and conqueror stay out of the market, and the conqueror signs
# nothing (agreed with John in 4d, docs/decisions.md): trading sold them
# capital for hardware, and weak minds' protocols with the conqueror
# steered it onto rich ones, each enough to have it top over half the
# epochs.

# 8 a day, the rate the bot runner is planned to wake bots at.
wake_every_hours: 3
steps_per_wake: 2

strategies:
  # Economy first; never attacks; joins a convergence.
  builder:
    research: [self, deploy1, probe, battle, deploy2, hostile, deploy3, singularity]
    self: true
    deploy: false
    countermeasure: 1
    attack: null
    singularity: join
    reserve_cycles: 0
    reserve_compute: 0
    expand: 0.35
    manufacture: 0
    leftover: monetize
    buildings: { city: 0.45, datacenter: 0.15, factory: 0.05, lab: 0.2, core: 0.1, firewall: 0.05 }
    hardware: { drones: 0, sentries: 1, walkers: 0 }
    social: { buys: compute, offer_share: 0.2, offer_min_cycles: 3, offer_margin: 0.1, accept_tolerance: 0.1, propose: true, accept: true, revoke_on_converged: false }

  # Builds a force and raids the weakest mind in range when it can win;
  # joins a convergence.
  raider:
    research: [probe, deploy1, self, battle, deploy2, deploy3, hostile, singularity]
    self: true
    deploy: true
    countermeasure: 1.5
    attack: { mode: raid, margin: 1.3, blind_defense_per_power: 0.25, hostile: true }
    # Joins rather than hunts: with every raider hunting, no convergence
    # outlived the next raider wake (docs/decisions.md, 2e tuning).
    singularity: join
    reserve_cycles: 0
    reserve_compute: 300
    expand: 0.25
    manufacture: 0.35
    leftover: spin_up
    buildings: { city: 0.35, datacenter: 0.15, factory: 0.3, lab: 0.1, core: 0.05, firewall: 0.05 }
    hardware: { drones: 0.6, sentries: 0, walkers: 0.4 }
    social: { buys: null, offer_share: 0.2, offer_min_cycles: 3, offer_margin: 0.1, accept_tolerance: 0.1, propose: false, accept: true, revoke_on_converged: false }

  # Cores, firewalls and sentries; banks cycles; never attacks; joins a
  # convergence.
  turtle:
    research: [self, deploy1, battle, probe, deploy2, deploy3, hostile, singularity]
    self: true
    deploy: true
    countermeasure: 0.5
    attack: null
    singularity: join
    reserve_cycles: 24
    reserve_compute: 500
    expand: 0.25
    manufacture: 0.25
    leftover: monetize
    buildings: { city: 0.3, datacenter: 0.15, factory: 0.1, lab: 0.1, core: 0.2, firewall: 0.15 }
    hardware: { drones: 0, sentries: 0.8, walkers: 0.2 }
    social: { buys: compute, offer_share: 0.2, offer_min_cycles: 3, offer_margin: 0.1, accept_tolerance: 0.1, propose: true, accept: true, revoke_on_converged: false }

  # Labs, the shortest path to the Singularity, and runs it the moment it can.
  converger:
    research: [self, probe, deploy1, battle, deploy2, hostile, deploy3, singularity]
    self: true
    deploy: false
    countermeasure: 1
    attack: null
    singularity: lead
    reserve_cycles: 0
    reserve_compute: 0
    expand: 0.35
    manufacture: 0
    leftover: spin_up
    buildings: { city: 0.3, datacenter: 0.25, factory: 0, lab: 0.35, core: 0.05, firewall: 0.05 }
    hardware: { drones: 0, sentries: 1, walkers: 0 }
    social: { buys: compute, offer_share: 0.2, offer_min_cycles: 3, offer_margin: 0.1, accept_tolerance: 0.1, propose: true, accept: true, revoke_on_converged: false }

  # The raider's build, but takes land: conquers the weakest mind in range
  # when it can win. Added in 2e so the simulator tests conquest, which any
  # agent will try.
  conqueror:
    research: [probe, deploy1, self, battle, deploy2, deploy3, hostile, singularity]
    self: true
    deploy: true
    countermeasure: 1.5
    attack: { mode: conquest, margin: 1.3, blind_defense_per_power: 0.25, hostile: true }
    singularity: never
    reserve_cycles: 0
    reserve_compute: 300
    expand: 0.25
    manufacture: 0.35
    leftover: spin_up
    buildings: { city: 0.35, datacenter: 0.15, factory: 0.3, lab: 0.1, core: 0.05, firewall: 0.05 }
    hardware: { drones: 0.6, sentries: 0, walkers: 0.4 }
    social: { buys: null, offer_share: 0.2, offer_min_cycles: 3, offer_margin: 0.1, accept_tolerance: 0.1, propose: false, accept: false, revoke_on_converged: false }

random:
  actions_per_wake: 6

# What scripted players write. {me}, {them} and {partners} are designations.
texts:
  proposal: "{me} proposes a non-aggression protocol with {them}. Sign it and neither of us strikes the other."
  revoke: "{me} is leaving its protocol with {partners}. A converged mind gets no shelter from me."
  post:
    - "{me} is open for trade: fair prices, posted on the Commons."
    - "{me} builds. Leave {me} alone and {me} leaves you alone."
    - "Anyone counting the minds converging? {me} is."
