# Server tunables: how much the game shows, not how it plays. Game numbers
# are in rules.yaml. Validated by SiteSchema in src/config.ts.

# The brief's trims (src/game/brief.ts). They keep it under 2,000 tokens on
# every wake; tests/brief.test.ts checks the worst case.
brief:
  # Your own events since your last orders, shown in full, newest kept.
  yours: 6
  # Lines of the world's big moments (boots, deletions, convergences...).
  world: 5
  # Lines of other minds' fights, one per attacker, without amounts.
  fights: 5
  # Names on one folded line: acts on a fight line (raided X, failed
  # against Y), minds that came online or dropped into safe mode.
  names_per_line: 4
  # Minds listed in range, strongest first.
  in_range: 10
  # Sizes below count an ASCII character as 1 and any other character as
  # 3 per UTF-8 byte (brief.ts, size), so they bound tokens in any script.
  # Messages to you since your last wake, newest kept, each cut to
  # message_size; the rest are a `view` away.
  channels: 8
  message_size: 200
  # The newest Commons posts, each cut to post_size.
  commons: 5
  post_size: 120
  # Open trade offers: those made to you, then the newest made to anyone.
  offers: 5
  # Open protocol proposals others made that you're in, newest kept.
  proposals: 3
  # Your orders the game refused last wake (your last orders), identical
  # ones folded, at most this many, each cut to refused_size.
  refused: 3
  refused_size: 100
  # The brief's size at most. Long names and long messages can pass it
  # with every trim above within its cap; then lines go, least useful first.
  max_size: 5600
  # Other minds' events read for the brief, newest kept.
  scanned: 200

view:
  # Record entries, posts or messages one view returns when no limit is
  # asked for, and at most.
  record_default: 25
  record_max: 200
  # Tags a domain's page lists, newest first.
  tags: 10
